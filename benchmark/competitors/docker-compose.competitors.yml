# Uniform-quota (4 vCPU / 8 GiB RAM) containerized competitor benchmark stack (Exp-5).
# Run via: docker compose -f benchmark/competitors/docker-compose.competitors.yml up -d <service>

services:
  iotdb-ours:
    image: eclipse-temurin:17-jre
    container_name: bench-iotdb-ours
    cpus: 4.0
    mem_limit: 8g
    working_dir: /opt/iotdb
    volumes:
      - ../../distribution/target/apache-iotdb-2.0.11-SNAPSHOT-all-bin/apache-iotdb-2.0.11-SNAPSHOT-all-bin:/opt/iotdb
    ports:
      - "6667:6667"
      - "10710:10710"
    command:
      - bash
      - -c
      - |
        bash sbin/start-standalone.sh -c conf -r &&
        bash sbin/start-streamnode.sh &&
        tail -f logs/log_streamnode_all.log logs/log_datanode_all.log

  tdengine:
    image: tdengine/tdengine:3.3.2.0
    container_name: bench-tdengine
    cpus: 4.0
    mem_limit: 8g
    environment:
      TAOS_FQDN: bench-tdengine
    ports:
      - "6030:6030"
      - "6041:6041"

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: bench-timescaledb
    cpus: 4.0
    mem_limit: 8g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bench_password
      POSTGRES_DB: tsbench
    ports:
      - "5432:5432"

  influxdb:
    image: influxdb:2.7
    container_name: bench-influxdb
    cpus: 4.0
    mem_limit: 8g
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: bench
      DOCKER_INFLUXDB_INIT_PASSWORD: bench_password
      DOCKER_INFLUXDB_INIT_ORG: bench_org
      DOCKER_INFLUXDB_INIT_BUCKET: tsbench
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: bench-admin-token-123456
    ports:
      - "8086:8086"

  flink-jobmanager:
    image: flink:1.19-java17
    container_name: bench-flink-jm
    cpus: 2.0
    mem_limit: 4g
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    ports:
      - "8081:8081"

  flink-taskmanager:
    image: flink:1.19-java17
    container_name: bench-flink-tm
    cpus: 2.0
    mem_limit: 4g
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
